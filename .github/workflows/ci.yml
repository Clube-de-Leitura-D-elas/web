name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  quality:
    name: Tipos, lint e formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check

  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn test:coverage --ci

      - name: Publica o relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov-report
          retention-days: 7
          if-no-files-found: ignore
